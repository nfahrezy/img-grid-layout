<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Grid Layout</title>

    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="items" style="grid-area: box-1;">
            <img src="images/gunung-1.jpg" alt="Gunung Pertama" class="gunung">
        </div>
        <div class="items" style="grid-area: box-2;">
            <img src="images/gunung-2.jpg" alt="Gunung Kedua" class="gunung"> 
        </div>
        <div class="items" style="grid-area: box-3;">
            <img src="images/gunung-3.jpg" alt="Gunung Ketiga" class="gunung">
        </div>
        <div class="items" style="grid-area: box-4;">
            <img src="images/gunung-4.jpg" alt="Gunung Keempat" class="gunung"> 
        </div>
        <div class="items" style="grid-area: box-5;">
            <img src="images/gunung-5.jpg" alt="Gunung Kelima" class="gunung"> 
        </div>
        <div class="items" style="grid-area: box-6;">
            <img src="images/gunung-6.jpg" alt="Gunung Keenam" class="gunung"> 
        </div>
    </div>
</body>
</html>
